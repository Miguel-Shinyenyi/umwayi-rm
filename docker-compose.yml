services:
  api:
    build: .
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://umwayi:umwayi@db:5432/umwayi
      MODEL_ID: meta-models/muse-spark-open-1026
      DEMO_MODE: "true"
      BASENTEN_API_KEY: ${BASENTEN_API_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: umwayi
      POSTGRES_PASSWORD: umwayi
      POSTGRES_DB: umwayi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umwayi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
